<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Clock</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.header{
    background:#eaeaea;
    border:2px solid #333;
    padding:15px 20px;
    font-size:30px;
    font-weight:bold;
}

.clock-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
}

.clock-card{
    border:1px solid #333;
    background:#fff;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    min-height:170px;
}

.country{
    font-size:18px;
    font-weight:bold;
    color:#1e293b;
    margin-bottom:10px;
}

.time{
    font-size:34px;
    font-weight:bold;
    color:#4169E1;
}

.date{
    margin-top:10px;
    color:#666;
    font-size:15px;
}

/* Analog Clock */
.analog-clock{
    width:110px;
    height:110px;
    border:4px solid #000;
    border-radius:50%;
    position:relative;
    background:#fff;
}

/* Clock Numbers */
.number{
    position:absolute;
    font-size:12px;
    font-weight:bold;
}

.n12{
    top:5px;
    left:50%;
    transform:translateX(-50%);
}

.n3{
    right:8px;
    top:50%;
    transform:translateY(-50%);
}

.n6{
    bottom:5px;
    left:50%;
    transform:translateX(-50%);
}

.n9{
    left:8px;
    top:50%;
    transform:translateY(-50%);
}

/* Hands */
.hand{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:bottom center;
}

.hour{
    width:4px;
    height:28px;
    background:#222;
    margin-left:-2px;
    border-radius:4px;
}

.minute{
    width:3px;
    height:38px;
    background:#444;
    margin-left:-1.5px;
    border-radius:4px;
}

.second{
    width:2px;
    height:45px;
    background:red;
    margin-left:-1px;
}

.center-dot{
    width:10px;
    height:10px;
    background:#000;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

@media(max-width:768px){

    .clock-grid{
        grid-template-columns:1fr;
    }

    .clock-card{
        flex-direction:column;
        gap:15px;
        text-align:center;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        🌍 World Clock
    </div>

    <div class="clock-grid">

        <!-- India -->
        <div class="clock-card">
            <div>
                <div class="country">🇮🇳 India</div>
                <div class="time" id="india-time"></div>
                <div class="date" id="india-date"></div>
            </div>

            <div class="analog-clock" id="india-clock">
                <span class="number n12">12</span>
                <span class="number n3">3</span>
                <span class="number n6">6</span>
                <span class="number n9">9</span>

                <div class="hand hour"></div>
                <div class="hand minute"></div>
                <div class="hand second"></div>
                <div class="center-dot"></div>
            </div>
        </div>

        <!-- USA -->
        <div class="clock-card">
            <div>
                <div class="country">🇺🇸 USA</div>
                <div class="time" id="usa-time"></div>
                <div class="date" id="usa-date"></div>
            </div>

            <div class="analog-clock" id="usa-clock">
                <span class="number n12">12</span>
                <span class="number n3">3</span>
                <span class="number n6">6</span>
                <span class="number n9">9</span>

                <div class="hand hour"></div>
                <div class="hand minute"></div>
                <div class="hand second"></div>
                <div class="center-dot"></div>
            </div>
        </div>

        <!-- UK -->
        <div class="clock-card">
            <div>
                <div class="country">🇬🇧 UK</div>
                <div class="time" id="uk-time"></div>
                <div class="date" id="uk-date"></div>
            </div>

            <div class="analog-clock" id="uk-clock">
                <span class="number n12">12</span>
                <span class="number n3">3</span>
                <span class="number n6">6</span>
                <span class="number n9">9</span>

                <div class="hand hour"></div>
                <div class="hand minute"></div>
                <div class="hand second"></div>
                <div class="center-dot"></div>
            </div>
        </div>

        <!-- Japan -->
        <div class="clock-card">
            <div>
                <div class="country">🇯🇵 Japan</div>
                <div class="time" id="japan-time"></div>
                <div class="date" id="japan-date"></div>
            </div>

            <div class="analog-clock" id="japan-clock">
                <span class="number n12">12</span>
                <span class="number n3">3</span>
                <span class="number n6">6</span>
                <span class="number n9">9</span>

                <div class="hand hour"></div>
                <div class="hand minute"></div>
                <div class="hand second"></div>
                <div class="center-dot"></div>
            </div>
        </div>

        <!-- Australia -->
        <div class="clock-card">
            <div>
                <div class="country">🇦🇺 Australia</div>
                <div class="time" id="aus-time"></div>
                <div class="date" id="aus-date"></div>
            </div>

            <div class="analog-clock" id="aus-clock">
                <span class="number n12">12</span>
                <span class="number n3">3</span>
                <span class="number n6">6</span>
                <span class="number n9">9</span>

                <div class="hand hour"></div>
                <div class="hand minute"></div>
                <div class="hand second"></div>
                <div class="center-dot"></div>
            </div>
        </div>

        <!-- France -->
        <div class="clock-card">
            <div>
                <div class="country">🇫🇷 France</div>
                <div class="time" id="france-time"></div>
                <div class="date" id="france-date"></div>
            </div>

            <div class="analog-clock" id="france-clock">
                <span class="number n12">12</span>
                <span class="number n3">3</span>
                <span class="number n6">6</span>
                <span class="number n9">9</span>

                <div class="hand hour"></div>
                <div class="hand minute"></div>
                <div class="hand second"></div>
                <div class="center-dot"></div>
            </div>
        </div>

    </div>
</div>

<script>

function updateClock(timeZone, timeId, dateId){

    const now = new Date();

    const time = now.toLocaleTimeString("en-US",{
        timeZone:timeZone,
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit'
    });

    const date = now.toLocaleDateString("en-US",{
        timeZone:timeZone,
        weekday:'long',
        year:'numeric',
        month:'long',
        day:'numeric'
    });

    document.getElementById(timeId).textContent = time;
    document.getElementById(dateId).textContent = date;
}

function updateAnalogClock(timeZone, clockId){

    const now = new Date();

    const zonedTime = new Date(
        now.toLocaleString("en-US",{timeZone})
    );

    const hours = zonedTime.getHours();
    const minutes = zonedTime.getMinutes();
    const seconds = zonedTime.getSeconds();

    const hourDeg = (hours % 12) * 30 + minutes * 0.5;
    const minuteDeg = minutes * 6 + seconds * 0.1;
    const secondDeg = seconds * 6;

    const clock = document.getElementById(clockId);

    clock.querySelector(".hour").style.transform =
        `rotate(${hourDeg}deg)`;

    clock.querySelector(".minute").style.transform =
        `rotate(${minuteDeg}deg)`;

    clock.querySelector(".second").style.transform =
        `rotate(${secondDeg}deg)`;
}

function updateAllClocks(){

    updateClock("Asia/Kolkata","india-time","india-date");
    updateAnalogClock("Asia/Kolkata","india-clock");

    updateClock("America/New_York","usa-time","usa-date");
    updateAnalogClock("America/New_York","usa-clock");

    updateClock("Europe/London","uk-time","uk-date");
    updateAnalogClock("Europe/London","uk-clock");

    updateClock("Asia/Tokyo","japan-time","japan-date");
    updateAnalogClock("Asia/Tokyo","japan-clock");

    updateClock("Australia/Sydney","aus-time","aus-date");
    updateAnalogClock("Australia/Sydney","aus-clock");

    updateClock("Europe/Paris","france-time","france-date");
    updateAnalogClock("Europe/Paris","france-clock");
}

updateAllClocks();
setInterval(updateAllClocks,1000);

</script>

</body>
</html>
